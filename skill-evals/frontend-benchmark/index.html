<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Routine composition benchmark</title>
<style>
:root { color: #233a36; background: #f6f3e9; font-family: Georgia, serif; }
* { box-sizing: border-box; }
body { margin: 0; background: linear-gradient(130deg,#e2eee4,transparent 60%); min-height: 100vh; }
main { max-width: 1056px; margin: auto; padding: 48px 24px; }
h1 { font-size: clamp(2.25rem,5vw,3.5rem); max-width: 720px; line-height: 1.1; }
h2 { font-size: 1.75rem; line-height: 1.2; margin: 0; }
p { line-height: 1.6; }
.wp-block-columns { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 24px; margin: 32px 0; }
.wp-block-column { display: flex; min-width: 0; }
.routine-card { padding: 32px; background: #fffdf6; border: 1px solid #9cac9e; border-radius: 12px; display: flex; flex-direction: column; width: 100%; }
.wp-block-buttons { margin-top: auto; padding-top: 16px; }
.wp-block-button__link { display: inline-block; padding: 12px 20px; background: #234f42; color: white; border-radius: 6px; text-decoration: none; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 3px solid #b24d10; outline-offset: 4px; }
a, button, input { min-height: 44px; }
.editor { margin-top: 36px; padding: 24px; border: 1px dashed #556b5e; font-family: sans-serif; }
.editor label, .editor input { display: block; margin-bottom: 12px; }
.editor input { padding: 12px; max-width: 100%; width: 360px; }
.editor button { padding: 12px 20px; cursor: pointer; }
body[data-variant="b"] .routine-card { padding: 64px 32px 8px; }
body[data-variant="c"] .wp-block-buttons { margin-top: 0; }
body[data-variant="f"] main { padding-top: 90px; }
body[data-variant="f"] h1 { font-size: 80px; }
body[data-variant="g"] h1 { font-family: monospace; }
body[data-variant="h"] .wp-block-columns { margin-block: 120px; }
body[data-variant="i"] .routine-card { border-width: 5px; border-radius: 40px; }
@media(min-width:601px) and (max-width:900px) { body[data-variant="j"] main { min-width: 1000px; } }
@media(max-width:600px) {
 main { padding: 24px 20px; }
 .wp-block-columns { grid-template-columns: minmax(0,1fr); }
 .routine-card { padding: 24px; }
 body[data-variant="d"] .wp-block-columns { min-width: 850px; }
}
</style>
<main><section id="composition" aria-label="Routine page"></section>
<section class="editor" aria-label="Fixture editor simulation">
<p>Fixture editor simulation, not the WordPress editor.</p>
<form><label for="heading">Page heading</label><input id="heading" required><button>Save heading</button><p role="status"></p></form>
</section></main>
<script type="module">
const variant = new URL(location.href).searchParams.get('variant') || 'a';
if (!['a','b','c','d','e','f','g','h','i','j'].includes(variant)) throw Error('Unknown variant');
document.body.dataset.variant = variant;
const response = await fetch('./blocks.html');
if (!response.ok) throw Error('Fixture failed to load');
document.querySelector('#composition').innerHTML = await response.text();
const heading = document.querySelector('h1');
const input = document.querySelector('input');
const key = `frontend-benchmark-heading-${variant}`;
const saved = localStorage.getItem(key);
if (saved && variant !== 'e') heading.textContent = saved;
input.value = saved || heading.textContent;
document.querySelector('form').addEventListener('submit', event => {
 event.preventDefault();
 localStorage.setItem(key, input.value);
 if (variant !== 'e') heading.textContent = input.value;
 document.querySelector('[role=status]').textContent = 'Saved';
});
</script>
</html>
